{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
  {# Screen 1 / UI-02: same form for contributors and moderators #}
  <form class="form-card" method="post">
    <h1>Log In</h1>
    <label>Email or username
      <input name="identifier" maxlength="64" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" maxlength="25" required>
    </label>
    <button class="btn btn-accent" type="submit">Log In</button>
    <p class="muted">No account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
  </form>
{% endblock %}
