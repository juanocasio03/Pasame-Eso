{% extends "base.html" %}
{% block title %}Create Post{% endblock %}
{% block content %}
  {# Screen 3 / UI-04, REQ.4.1 #}
  <form class="form-card" method="post" enctype="multipart/form-data">
    <h1>Create Post</h1>
    <label>Title
      <input name="title" maxlength="100" required>
    </label>
    <label>Resource type
      <select name="resource_type" required>
        {% for key, label in resource_types.items() %}
          <option value="{{ key }}">{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Course ID
      <input name="course_code" placeholder="CCOM4030" pattern="[A-Za-z]{4}[0-9]{4}" maxlength="8" required>
    </label>
    <label>Course name
      <input name="course_name" maxlength="64">
    </label>
    <label>Professor
      <input name="professor" maxlength="25" required>
    </label>
    <label>Description
      <textarea name="description" rows="4"></textarea>
    </label>
    <label>File (PDF, DOCX, PNG, JPG or TXT, max {{ config.MAX_UPLOAD_MB }} MB)
      <input type="file" name="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.txt" required>
    </label>
    <button class="btn btn-accent" type="submit">Publish</button>
  </form>
{% endblock %}
